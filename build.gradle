plugins {
    id 'java'
    id 'application'
    // 1. Update versi plugin ke yang lebih stabil
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

group = 'simp'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // Library buat bikin Excel
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'

    // Library buat bikin PDF (iText 7)
    implementation 'com.itextpdf:kernel:7.2.5'
    implementation 'com.itextpdf:layout:7.2.5'
    implementation 'com.itextpdf:io:7.2.5'

    // Jangan lupa library PostgreSQL & Dotenv yang kemarin kita bahas
    implementation 'org.postgresql:postgresql:42.5.4'
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'
}

javafx {
    // 2. Samakan dengan versi JDK kamu (JDK 24)
    version = "24"
    modules = ['javafx.controls', 'javafx.fxml']
}

sourceSets {
    main {
        resources {
            // Memastikan resource terbaca
            srcDirs = ['src/main/res']
        }
    }
}

// 3. Hapus bagian jvmArgs manual tadi, biarkan plugin yang bekerja
application {
    mainClass = 'MainApp'
}